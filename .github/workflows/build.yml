name: build

# Native builds on each target. Cross-compiling is available for local
# iteration (see docs/cross-compile.md) but CI builds natively, because that is
# the only way to produce a macOS package at all and it keeps the Windows
# Python situation to "whatever setup-python installed".
#
# Every job runs its own output. A build that only proves the linker was happy
# is not worth the minutes: all three failure modes this project has actually
# hit -- a missing stdlib zip, a missing .pyd directory, an absolute install
# name -- link cleanly and fail at startup.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 on purpose, not ubuntu-latest: the glibc the binary is
          # linked against is a floor for every machine that runs it, and 22.04
          # buys Debian 12 and its derivatives.
          - { name: Linux,   os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }
          # macos-latest is arm64. There is no universal2 CPython to bundle,
          # so this is an arm64-only package by construction; see docs/macos.md.
          - { name: macOS,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # SDL3 builds these from source on Linux; without them the X11 and
      # Wayland backends are silently omitted and the window has no way to be
      # borderless or transparent. The appindicator runtime is needed by the
      # smoke test as well as the build: a missing tray is fatal by design.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libgtk-3-dev \
            libayatana-appindicator3-dev libasound2-dev libpulse-dev \
            xvfb dbus-x11

      # assets/clippy.png is committed, rendered from assets/clippy.svg by
      # tools/render_assets.py. It is not regenerated here: that script shells
      # out to rsvg-convert, inkscape or ImageMagick, none of which is present
      # on all three runner images.

      # GC_BUILD_TESTS is on for every platform so the pixel test is at least
      # compiled everywhere; it is only run on Linux, where the build-tree
      # layout is single-config and predictable.
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGC_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package
        id: package
        run: cmake --build build --config Release --target package

      # Runs the packaged tree, not the build tree, so it exercises the
      # relocated layout: the bundled interpreter, the stdlib zip, the loose
      # extension modules, and on macOS the rewritten install names.
      #
      # Relocated and with the environment stripped, for the same reason the
      # macOS job does it: setup-python puts its own lib directory on
      # LD_LIBRARY_PATH, so a package that fails to bundle its interpreter
      # still runs perfectly well on this runner. That is exactly how
      # lib/libpython3.11.so shipped under the linker name rather than the
      # SONAME and went unnoticed -- the loader quietly used the host's.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mv build/stage/gobboclippy-*-Linux "$RUNNER_TEMP/relocated"
          cd "$RUNNER_TEMP/relocated"

          # ldd under the same stripped environment as the runs below, not the
          # step's ambient one. The executable carries DT_RUNPATH, and glibc
          # searches LD_LIBRARY_PATH *before* DT_RUNPATH -- so with
          # setup-python's lib directory still on it, a correctly bundled
          # libpython resolves to the host's copy anyway and this check fails
          # on a package that has nothing wrong with it.
          #
          # Nothing is lost by stripping it: a libpython that genuinely is not
          # in the package then falls through to ld.so.cache or comes back
          # "not found", and neither of those is under $PWD either.
          ldd="env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH ldd"
          $ldd ./gobboclippy

          # Every library we ship has to resolve inside the package. Anything
          # that escapes to the host is a library we are not actually bundling.
          escaped=$($ldd ./gobboclippy \
                    | grep -E 'libpython|libSDL3' \
                    | grep -v "$PWD" || true)
          if [ -n "$escaped" ]; then
            echo "::error::bundled libraries resolved outside the package:"
            echo "$escaped"
            exit 1
          fi

          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH \
            xvfb-run -a dbus-run-session -- ./gobboclippy --capabilities
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH \
            xvfb-run -a dbus-run-session -- ./gobboclippy --script scripts/smoke_test.py

      # The same binary as python. No display for any of this: an install
      # runs on a machine with none, and the interpreter mode never touches
      # SDL video.
      #
      # The install is real -- ffwf-tau-agent-core from PyPI, wheels only --
      # because the interpreter mode exists to run exactly that, and a pip
      # that starts is not a pip that can install into this layout. The last
      # line closes the loop: what pip put in site/ is what the pet imports.
      - name: Interpreter mode (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP/relocated"
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH \
            ./gobboclippy --python -c 'import sys; print(sys.executable, sys.prefix)'
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH \
            ./python3 -m pip --version
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH \
            ./python3 -m pip install --only-binary=:all: --disable-pip-version-check \
              ffwf-tau-agent-core
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH \
            ./python3 -c 'import tau_agent_core, sys; assert "/site/" in tau_agent_core.__file__, tau_agent_core.__file__'
          printf 'import clippy, tau_agent_core\nclippy.log("pet imported " + tau_agent_core.__file__)\nclippy.quit()\n' \
            > "$RUNNER_TEMP/import_tau.py"
          env -u PYTHONHOME -u PYTHONPATH -u LD_LIBRARY_PATH \
            xvfb-run -a dbus-run-session -- ./gobboclippy --script "$RUNNER_TEMP/import_tau.py"

      # Twice, on purpose. The effect compositor avoids SDL_ComposeCustomBlendMode
      # so that it works on the software renderer, which supports none -- and the
      # only way that stays true is to actually run it there. The default run is
      # whatever SDL picks (opengl under xvfb, via llvmpipe).
      - name: Effect pixel test (Linux)
        if: runner.os == 'Linux'
        run: |
          cd build
          xvfb-run -a ./fx_pixels
          SDL_RENDER_DRIVER=software xvfb-run -a ./fx_pixels

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd build/stage/gobboclippy-*-Windows
          ./gobboclippy.exe --capabilities
          ./gobboclippy.exe --script scripts/smoke_test.py
          ./python.exe -c 'import sys; print(sys.executable, sys.prefix)'
          ./python.exe -m pip --version

      # The bundle's identity, checked before anything is run. These three keys
      # are the entire reason the macOS package is an .app: without them the
      # microphone has no prompt to show and no grant to be recorded against,
      # and the failure is silent -- the app simply records nothing.
      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(echo build/stage/gobboclippy-*-macOS/gobboclippy.app)
          plutil -lint "$app/Contents/Info.plist"
          plutil -extract CFBundleIdentifier           raw "$app/Contents/Info.plist"
          plutil -extract CFBundleExecutable           raw "$app/Contents/Info.plist"
          plutil -extract NSMicrophoneUsageDescription raw "$app/Contents/Info.plist"
          test -f "$app/Contents/Resources/gobboclippy.icns"

          # The seal, not just the executable's own signature. This is what a
          # file edited after signing breaks, and it is how a repacked release
          # is checked before it goes out.
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"

      # Also proves relocatability the only way that means anything: from a
      # different directory, with the build tree's Python removed from the
      # environment. If an absolute install name survived, this is where it
      # shows up.
      #
      # Everything is run through the bundle's own layout -- the binary from
      # Contents/MacOS, the payload from Contents/Resources -- because that is
      # the only layout that ships. SDL_GetBasePath is what bridges the two,
      # and it is not exercised by anything else.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          mv build/stage/gobboclippy-*-macOS "$RUNNER_TEMP/relocated"
          app="$RUNNER_TEMP/relocated/gobboclippy.app"
          otool -L "$app/Contents/MacOS/gobboclippy"
          cd "$app/Contents/Resources"
          env -u PYTHONHOME -u PYTHONPATH ../MacOS/gobboclippy --capabilities
          env -u PYTHONHOME -u PYTHONPATH ../MacOS/gobboclippy --script scripts/smoke_test.py
          env -u PYTHONHOME -u PYTHONPATH ./python3 -c 'import sys; print(sys.executable, sys.prefix)'
          env -u PYTHONHOME -u PYTHONPATH ./python3 -m pip --version

      # Mount what a user would actually download. A DMG that builds and does
      # not mount, or mounts without the app, is a release nobody can open --
      # and the staging tree above cannot tell us that.
      #
      # Not a substitute for the microphone test, which no runner can do: there
      # is no audio input device and no one to answer a TCC prompt. What this
      # proves is that the bundle survives the image round-trip with its seal
      # intact, which is the part that has a way to go wrong quietly.
      - name: Disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          dmg=$(echo build/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/mnt" "$dmg"
          ls -l "$RUNNER_TEMP/mnt"
          test -L "$RUNNER_TEMP/mnt/Applications"
          codesign --verify --deep --strict "$RUNNER_TEMP/mnt/gobboclippy.app"
          hdiutil detach "$RUNNER_TEMP/mnt"

      # Keyed on the package step, not on the job: a smoke-test failure still
      # fails the job, but the archive is kept so the failure can be taken
      # apart instead of guessed at. If packaging itself never ran there is
      # nothing to upload, and if-no-files-found stays fatal for the case that
      # matters -- a package target that produced nothing.
      #
      # always() is load-bearing, not decoration. A step condition that names
      # no status function gets an implicit success(), so the plain
      # steps.package check was still skipped the moment a smoke test failed --
      # which is the only time this upload is worth anything, and is why the
      # first two Linux failures left no artifact to take apart.
      - uses: actions/upload-artifact@v4
        if: always() && steps.package.outcome == 'success'
        with:
          name: gobboclippy-${{ matrix.name }}
          path: |
            build/*.tar.gz
            build/*.zip
            build/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the tag's own annotation, which is the release notes. Tags are
      # signed objects rather than refs, so fetch-depth: 0 is what makes the
      # message readable at all -- a shallow checkout gets the commit and not
      # the tag object hanging off it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with: { path: dist }

      - name: Checksums
        run: |
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.dmg' \) \
            -exec sha256sum {} + | sed 's|dist/[^/]*/||' > dist/SHA256SUMS
          cat dist/SHA256SUMS

      # v0.1.0 and v0.2.0 both shipped with a one-line "Full Changelog" body
      # and a hand-written tag annotation nobody could see: generate_release_notes
      # supplies the body when none is given, so the annotation was written and
      # then discarded. It is the release notes, so it becomes the body here.
      #
      # The subject line is dropped: GitHub already shows the tag name as the
      # release title, and repeating it as the first line of the body reads as
      # a duplicate.
      #
      # The tag object type is checked first, and that check is the whole point
      # of this step being three lines instead of one. For a lightweight tag
      # %(contents) does not come back empty -- it falls through to the tagged
      # *commit's* message, which is plausible enough to publish and wrong.
      # Refusing here costs a re-tag; not refusing ships a release whose notes
      # are a commit message nobody wrote for an audience.
      - name: Release notes from the tag annotation
        run: |
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is a lightweight tag; re-tag with -a"
            exit 1
          fi
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | tail -n +3 > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "::error::$GITHUB_REF_NAME is annotated with a subject and no body"
            exit 1
          fi
          cat NOTES.md

      # Anything with a hyphen in the tag -- v0.0.3-draft, v1.0.0-rc1 -- is a
      # prerelease. GitHub will not mark it as one on its own.
      #
      # generate_release_notes stays on alongside body_path: the API appends the
      # generated changelog to a body rather than replacing it.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/**/*.dmg
            dist/SHA256SUMS
          body_path: NOTES.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
