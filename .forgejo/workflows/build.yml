name: build

# For a self-hosted Debian podman runner.
#
# Linux is native. Windows is cross-compiled with mingw-w64 in the same
# container -- no Windows machine involved. macOS is absent on purpose: see
# docs/cross-compile.md, it cannot be built here at any effort.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  linux:
    runs-on: docker
    container:
      image: debian:12
    steps:
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates pkg-config \
            python3-dev python3 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libgtk-3-dev \
            libayatana-appindicator3-dev libasound2-dev libpulse-dev \
            xvfb

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGC_BUILD_TESTS=ON
          cmake --build build -j$(nproc)

      - name: Package
        run: cmake --build build --target package

      # Runs the packaged tree, not the build tree, so this also proves the
      # archive is relocatable and uses its own bundled interpreter.
      - name: Smoke test
        run: |
          cd build/stage/gobboclippy-*-Linux
          xvfb-run -a ./gobboclippy --capabilities
          xvfb-run -a ./gobboclippy --script scripts/smoke_test.py

      # Twice, on purpose: once on whatever SDL picks, once on the software
      # renderer, which has no custom blend modes. The compositor is written to
      # need none, and running it there is what keeps that true.
      - name: Effect pixel test
        run: |
          cd build
          xvfb-run -a ./fx_pixels
          SDL_RENDER_DRIVER=software xvfb-run -a ./fx_pixels

      - uses: actions/upload-artifact@v3
        with:
          name: gobboclippy-Linux
          path: build/*.tar.gz

  windows-cross:
    runs-on: docker
    # trixie, not bookworm, for one reason: wine. Bookworm ships wine 8.0,
    # which hands a process invalid standard handles when its stdio is a pipe.
    # CPython probes those handles at startup and aborts with "can't initialize
    # sys standard streams" -- the stock python.org python.exe fails there too,
    # so it is not something a build can fix. wine 10 in trixie runs the same
    # binary correctly with ordinary piped output, which is all CI has.
    container:
      image: debian:trixie
    steps:
      - name: Toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates pkg-config \
            mingw-w64 mingw-w64-tools python3 \
            wine wine64 xvfb xauth

      - uses: actions/checkout@v4

      # The Windows CPython kit is not in this repo -- it is ~26 MB of
      # prebuilt runtime. Point this at wherever you host it.
      # docs/cross-compile.md describes the expected layout.
      - name: Fetch Windows CPython kit
        run: |
          if [ -z "${{ vars.WINPY_KIT_URL }}" ]; then
            echo "WINPY_KIT_URL is not set; skipping the Windows build." >&2
            echo "See docs/cross-compile.md for how to build a kit." >&2
            exit 78
          fi
          mkdir -p deps/winpy
          curl -fsSL "${{ vars.WINPY_KIT_URL }}" -o /tmp/winpy.tar.gz
          tar xzf /tmp/winpy.tar.gz -C deps/winpy --strip-components=1

      - name: Build
        run: |
          cmake -B build-windows \
            -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/mingw-w64-x86_64.cmake \
            -DGC_WINPY_ROOT=deps/winpy \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-windows -j$(nproc)

      - name: Package
        run: cmake --build build-windows --target package

      # Runs the packaged tree under wine, so this covers the bundled
      # interpreter, the stdlib zip and the .pyd extension modules -- not just
      # that the binary links. wine is not Windows and this is not a substitute
      # for testing on the real thing, but it catches the packaging mistakes
      # that a cross-build makes easy to ship.
      - name: Smoke test (wine)
        run: |
          export WINEPREFIX=/tmp/wineprefix WINEDEBUG=-all
          xvfb-run -a wine wineboot -u || true
          cd build-windows/stage/gobboclippy-*-Windows
          xvfb-run -a wine ./gobboclippy.exe --capabilities
          xvfb-run -a wine ./gobboclippy.exe --script scripts/smoke_test.py

      - uses: actions/upload-artifact@v3
        with:
          name: gobboclippy-Windows
          path: build-windows/*.zip
