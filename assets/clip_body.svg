<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>gobboclippy: the paperclip, without the face</title>

  <!-- The wire alone, in the same 256x256 frame as clippy.svg so the eye and
       eyebrow offsets in scripts/clippy.py are readable against that file.

       This part scales on its own: the eyes and eyebrows are children of the
       sprite that draws it, and children inherit translation but not scale, so
       stretching the clip does not stretch the face. -->

  <defs>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0"    stop-color="#eef2f8"/>
      <stop offset="0.40" stop-color="#a8b8cd"/>
      <stop offset="1"    stop-color="#56677e"/>
    </linearGradient>
  </defs>

  <!-- One continuous stroke: inner arm up, over the top bend, down the middle
       arm, around the bottom bend, up the outer arm. Drawn twice -- the dark
       stroke underneath acts as the outline. -->
  <g transform="translate(6,-6)" fill="none" stroke-linecap="round">
    <path d="M 112,170 V 78 A 22,22 0 0 1 156,78 V 186 A 34,34 0 0 1 88,186 V 62"
          stroke="#28313d" stroke-width="23"/>
    <path d="M 112,170 V 78 A 22,22 0 0 1 156,78 V 186 A 34,34 0 0 1 88,186 V 62"
          stroke="url(#wire)" stroke-width="15"/>
  </g>
</svg>
